# 模型配置：d1024 门控双半脑（generalist-v5，gated-merge）
# 来源：dual_sft/GATED_DUAL_DESIGN.md（权威）+ 实际运行日志
#   GATED_V5_S300.log：model: d=1024 blocks=4 heads=16 kv=8 merge=gated
#   tied=True dropout=0.1 label_smoothing=0.1 params=85,542,235
# 本文件为扁平 key: value，供 scripts/train.py 内置简易读取器解析
# （无 PyYAML 依赖；不使用锚点、嵌套、复杂类型）。

recipe: generalist-v5
merge_method: gated
d_model: 1024
n_blocks: 4
n_heads: 16
n_kv_heads: 8
n_stem_blocks: 1
vocab_size: 4622
vocab_chars: 4619
tie_embeddings: true
dropout: 0.1
label_smoothing: 0.1
use_rms: true
pre_norm: true
pos_mode: rope
ff_mode: swiglu
init_style: gpt2
max_seq: 512
seq_len: 128
batch_size: 8
lr: 0.001
schedule: cosine
params: 85542235
# 门：每序列一个 g（0~1），由共享 stem（k=1）隐状态均值池化算出
#   g = sigmoid(w . mean_pool(h_stem) + b)；输入分流与输出混合用同一个 g；
#   左支吃经典/代码/对话/常识/推理，右支吃世界；BCE 监督 t=1 左 / t=0 右。
gate_loss_weight: 1.0
gate_left_domains: classics,code,dialogue,knowledge,reasoning
gate_right_domains: world
# 混合采样配比 v2（2026-11-13）：经典 25 / 代码 20 / 对话 10 / 常识 15 / 推理 15 / 世界 15
ratio_classics: 0.25
ratio_code: 0.20
ratio_dialogue: 0.10
ratio_knowledge: 0.15
ratio_reasoning: 0.15
ratio_world: 0.15
