# PyTorch 训练配置：门控 v5 默认运行（一块 300 步）
# 来源：configs/train_default.yaml（NumPy 版）+ 实际运行记录
#   GATED_V5_S300.log：model d=1024 blocks=4 heads=16 kv=8 merge=gated
#   tied=True dropout=0.1 label_smoothing=0.1 params=85,542,235
#   train: steps 300, save_every 10, warmup 10, seed 7, lr 1e-3,
#   cosine 到 min_lr_ratio 0.1, wd 0.01, max_grad_norm 1.0,
#   batch 8, seq 128, gate_loss_weight 1.0。
# 本文件为扁平 key: value，供 scripts/train.py 内置简易读取器解析
# （无 PyYAML 依赖；不使用锚点、嵌套、复杂类型）。

model_config: configs/model_gated.yaml
recipe: generalist-v5
steps: 300
save_every: 10
warmup_steps: 10
seed: 7
lr: 0.001
schedule: cosine
min_lr_ratio: 0.1
weight_decay: 0.01
max_grad_norm: 1.0
batch_size: 8
seq_len: 128
gate_loss_weight: 1.0
label_smoothing: 0.1
dropout: 0.1
grad_accum_steps: 1
# PyTorch 新增（NumPy 版没有）：
device: auto
amp: false
num_workers: 0
pin_memory: false
dataloader_num_batches: 300
checkpoint_dir: checkpoints
checkpoint_pattern: "generalist3_d1024_s<N>.pt"
# 断点文件：<stem>_last.pt（如 generalist3_d1024_s300_last.pt），
# 含参数 + Adam m/v + 随机数状态；重启后最多丢 save_every 步。
# 续跑规则（硬性，见 CONTRACT.md 与 trainer 注释）：
#   --resume 接 _last 文件时必须省略 --steps，由程序按
#   schedule_total_steps - 已跑步数 自动算剩余步数；
#   显式传 --steps 300 会跑到 step 310（schedule_total 不封顶）。
#   --resume 不恢复模型形状参数：d1024 续跑必须显式传全套形状参数
#   （--d-model 1024 --n-blocks 4 --n-heads 16 --n-kv-heads 8），
#   否则死在 config-mismatch assert 上。
#   续跑只 torch.load 一次（model + optimizer + rng 一起恢复后 del），
#   绝不像 NumPy 版那样 load 三次（2026-11-21 OOM 根因）。
resume_omit_steps: true
resume_requires_full_shape_flags: true
resume_shape_flags: "--d-model 1024 --n-blocks 4 --n-heads 16 --n-kv-heads 8"
